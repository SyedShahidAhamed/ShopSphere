services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: king@786
      MYSQL_DATABASE: shopsphere

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pking@786"]
      interval: 10s
      timeout: 5s
      retries: 10


  shopsphere:
    build:
      context: .

    container_name: shopsphere-app

    environment:
    
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      
    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"


volumes:
  mysql-data: